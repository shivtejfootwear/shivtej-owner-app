# Builds the Shivtej Owner App and publishes a downloadable APK artifact.
name: Build Shivtej Owner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect the APK
        shell: bash
        run: |
          set -eu
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::APK not found. Files found:"
            find app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" dist/Shivtej-Owner-App.apk
          ls -lh dist/Shivtej-Owner-App.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Shivtej-Owner-App
          path: dist/Shivtej-Owner-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports if build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
