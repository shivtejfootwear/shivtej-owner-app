# Builds and tests the Shivtej Owner App (native Android, Kotlin + Jetpack Compose).
# Outputs (download from the finished run > Artifacts):
#   Shivtej-Owner-App        release APK (signed with the owner's release key when the secrets below are set)
#   Shivtej-Owner-App-debug  debug APK
#   Shivtej-Managers-App     the separate managers app (catalog + shop-hours location), signed with the same key
#   unit-test-results        JVM unit test reports (always uploaded)
#   build-failure-reports    lint and build reports (only when a step failed)
#
# Repository secrets for a stable release key (set once, in Settings > Secrets and variables > Actions):
#   SHIVTEJ_KEYSTORE_BASE64   the .jks keystore file encoded with base64 (one line)
#   SHIVTEJ_KEYSTORE_PASSWORD keystore password
#   SHIVTEJ_KEY_ALIAS         key alias inside the keystore
#   SHIVTEJ_KEY_PASSWORD      key password
# Without these secrets the release APK is signed with the debug key (the run shows a warning).
#
# This file must live at   .github/workflows/build-apk.yml   in the ROOT of the GitHub repository.

name: Build Shivtej Owner APK

on:
  # no automatic build on every push (saves GitHub Actions minutes).
  # Build only when you start it: Actions > Build Shivtej Owner APK > Run workflow
  workflow_dispatch:

permissions:
  contents: write    # needed to publish the APKs to a Release (artifact storage can fill up; Releases do not)

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test, lint and build the APK
    runs-on: ubuntu-latest          # GitHub-hosted runner
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Finds settings.gradle.kts, so the build also works if the project was uploaded inside a sub-folder.
      - name: Find the Android project folder
        id: locate
        shell: bash
        run: |
          set -eu
          SETTINGS=$(find . -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts was not found. Upload the whole project (settings.gradle.kts, build.gradle.kts and the app folder) to the repository."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Android project folder: $DIR"
          ls -la "$DIR"
          if [ ! -f "$DIR/app/build.gradle.kts" ]; then
            echo "::error::$DIR/app/build.gradle.kts is missing - the app folder was not uploaded."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already has the Android SDK (platform 34, build-tools 34.0.0).
      # A third-party set-up action failed at its set-up step, so the workflow only checks that the SDK is there.
      - name: Verify the preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runs the JVM tests (ledger, returns and refunds, offline assistant rules). A failing test stops the build.
      # Gradle output is kept in $RUNNER_TEMP so that the errors can be shown as annotations and uploaded.
      - name: Unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-unit-tests.log"

      # Lint is reported but does not stop the build (the app has many screens; warnings are listed in the report).
      - name: Lint (report only)
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Prepare the release keystore from the secrets (if they are set)
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SHIVTEJ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHIVTEJ_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No release keystore secret (SHIVTEJ_KEYSTORE_BASE64). The release APK will be signed with the debug key. An installed app signed with another key cannot be updated over, so it must be uninstalled first (back up in the app first)."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/shivtej-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          # Fails early with a clear message if the password or the file is wrong
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "Release keystore loaded (contents are not printed)."
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build the debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-debug-build.log"

      - name: Build the release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          SHIVTEJ_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SHIVTEJ_KEYSTORE_PASSWORD: ${{ secrets.SHIVTEJ_KEYSTORE_PASSWORD }}
          SHIVTEJ_KEY_ALIAS: ${{ secrets.SHIVTEJ_KEY_ALIAS }}
          SHIVTEJ_KEY_PASSWORD: ${{ secrets.SHIVTEJ_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :staff:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release-build.log"

      - name: Collect the APKs
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for pair in "app/build/outputs/apk/release/app-release.apk:Shivtej-Owner-App.apk" \
                      "app/build/outputs/apk/debug/app-debug.apk:Shivtej-Owner-App-debug.apk" \
                      "staff/build/outputs/apk/release/staff-release.apk:Shivtej-Managers-App.apk"; do
            SRC="${pair%%:*}"; DST="${pair##*:}"
            if [ ! -f "$SRC" ]; then
              echo "::error::The build finished but $SRC does not exist. Files found:"
              find app/build/outputs -type f || true
              exit 1
            fi
            cp "$SRC" "$GITHUB_WORKSPACE/dist/$DST"
          done
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Check the APK signatures (which key signed each APK)
        continue-on-error: true
        shell: bash
        run: |
          for f in "$GITHUB_WORKSPACE/dist/"*.apk; do
            echo "== $(basename "$f")"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$f" || true
          done

      # Publish the APKs to a Release (always overwrites the "latest-build" release). Release storage is separate
      # from the Actions artifact storage, so the download keeps working even when the artifact quota is full.
      - name: Publish the APKs to the "latest-build" Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          TAG="latest-build"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$GITHUB_WORKSPACE/dist/"*.apk \
            --title "Latest build" \
            --notes "Shivtej Owner + Managers APKs. Built from ${GITHUB_SHA:0:7}. Download the file you need below."

      - name: Upload the release APK (artifact Shivtej-Owner-App)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Shivtej-Owner-App
          path: dist/Shivtej-Owner-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the managers app APK (artifact Shivtej-Managers-App)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Shivtej-Managers-App
          path: dist/Shivtej-Managers-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the debug APK (artifact Shivtej-Owner-App-debug)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Shivtej-Owner-App-debug
          path: dist/Shivtej-Owner-App-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Shows the compiler and test errors as annotations (readable through the GitHub API) and in this step's log.
      - name: Show compile and test errors
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          LOGS=("$RUNNER_TEMP"/gradle-*.log)
          if [ ${#LOGS[@]} -eq 0 ]; then echo "No Gradle log was written."; exit 0; fi
          for f in "${LOGS[@]}"; do
            echo "===== $(basename "$f") (last 250 lines)"
            tail -n 250 "$f"
          done
          { grep -hE '^e: |What went wrong|FAILED|Caused by|BUILD FAILED' "${LOGS[@]}" 2>/dev/null || true; } | head -60 | while IFS= read -r line; do
            echo "::error title=Gradle::${line//$'\r'/}"
          done

      - name: Upload the Gradle logs (always)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: ${{ runner.temp }}/gradle-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the unit test reports (always)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/reports/tests/
            ${{ steps.locate.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build and lint reports (only if a step failed)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/reports/
            ${{ steps.locate.outputs.dir }}/build/reports/
          if-no-files-found: ignore
          retention-days: 14
